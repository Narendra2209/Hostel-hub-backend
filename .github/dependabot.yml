# Dependabot configuration.
#
# npm workspaces share ONE lockfile at the repo root, so every entry below
# resolves against package-lock.json no matter which manifest it edits. The
# per-workspace entries exist so a bump to the SPA is labelled and reviewed
# separately from a bump to the CDK app - if that ever produces duplicate PRs
# for a dependency two workspaces share, delete the workspace entries and keep
# the root one, which can update the whole tree on its own.
#
# Minor and patch updates are grouped into a single weekly PR per workspace;
# majors arrive one at a time, because those are the ones that need reading.
version: 2

updates:
  # ---------------------------------------------------------------- root

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    labels: [dependencies]
    groups:
      root-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # ------------------------------------------------------------- shared
  # The contract package every other workspace imports. Zod is a runtime
  # dependency of the validation schemas, so its majors are deliberately
  # ungrouped.

  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    labels: [dependencies, shared]
    groups:
      shared-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # ------------------------------------------------------------ backend
  # Prisma ships the CLI and the client as a matched pair; grouping them keeps
  # a PR from bumping one without the other.

  - package-ecosystem: npm
    directory: /infrastructure
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope
    labels: [dependencies, infrastructure]
    groups:
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs']
      infrastructure-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # ------------------------------------------------------- github-actions
  # Scans .github/workflows; the directory is always "/" for this ecosystem.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
      include: scope
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
